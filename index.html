        { id: "enderpearl", name: { de: "Enderperlen (Ender Pearls)", en: "Ender Pearls" }, menge: 16, dia: 2, category: "SONSTIGES" },
        { id: "enderchest", name: { de: "Endertruhe (Ender Chest)", en: "Ender Chest" }, menge: 1, dia: 16, category: "SONSTIGES" },
        { id: "totem", name: { de: "Totem der Unsterblichkeit", en: "Totem of Undying" }, menge: 1, dia: 48, category: "SONSTIGES" },
        { id: "dragonhead", name: { de: "Drachenkopf (Dragon Head)", en: "Dragon Head" }, menge: 1, dia: 64, category: "SONSTIGES" },
        { id: "bounty", name: { de: "Kopfgeld (Bounty)", en: "Bounty" }, menge: 1, dia: 64, category: "SONSTIGES" },
        { id: "elytra", name: { de: "Elytra (Schwungflügel)", en: "Elytra" }, menge: 1, dia: 96, category: "SONSTIGES" },
        { id: "kill", name: { de: "1 Spieler Kill", en: "1 Player Kill" }, menge: 1, dia: 96, category: "SONSTIGES" }
    ];

    function getLangFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const langParam = params.get('lang');
        if (langParam && (langParam.toLowerCase() === 'de' || langParam.toLowerCase() === 'en')) {
            return langParam.toLowerCase();
        }
        return 'de';
    }

    function setLanguage(lang, updateUrl = true) {
        currentLang = lang;

        if (updateUrl && window.history && window.history.replaceState) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url.toString());
        }

        document.getElementById('btnDE').classList.toggle('active', lang === 'de');
        document.getElementById('btnEN').classList.toggle('active', lang === 'en');

        const t = translations[lang];
        document.getElementById('titleText').innerText = t.title;
        document.getElementById('lblSearch').innerText = t.searchLbl;
        document.getElementById('search').placeholder = t.searchPh;
        document.getElementById('lblItem').innerText = t.itemLbl;
        document.getElementById('lblUnit').innerText = t.unitLbl;
        document.getElementById('optItems').innerText = t.unitItems;
        document.getElementById('optStacks').innerText = t.unitStacks;
        document.getElementById('lblAmount').innerText = t.amountLbl;
        document.getElementById('btnAddToCart').innerText = t.btnAddToCart;
        document.getElementById('lblTotal').innerText = t.totalLbl;
        document.getElementById('lblCartTitle').innerText = t.cartTitle;

        renderCategories();
        filterItems();
        updateCartUI();
    }

    function renderCategories() {
        const t = translations[currentLang];
        const categoryBar = document.getElementById('categoryBar');
        const categories = ["ALL", "BAU-MATERIAL", "ERZE", "Book", "LOCATION", "SONSTIGES"];

        categoryBar.innerHTML = '';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `category-tab ${activeCategory === cat ? 'active' : ''}`;
            btn.dataset.cat = cat;
            btn.innerHTML = t.categories[cat] || cat;
            btn.onclick = () => {
                activeCategory = cat;
                renderCategories();
                filterItems();
            };
            categoryBar.appendChild(btn);
        });
    }

    function populateSelect(list) {
        const itemSelect = document.getElementById('itemSelect');
        const t = translations[currentLang];
        itemSelect.innerHTML = '';

        if (list.length === 0) {
            const opt = document.createElement('option');
            opt.innerText = currentLang === 'de' ? 'Keine Items gefunden' : 'No items found';
            itemSelect.appendChild(opt);
            calculate();
            return;
        }

        const categoryOrder = ["BAU-MATERIAL", "ERZE", "Book", "LOCATION", "SONSTIGES"];

        categoryOrder.forEach(cat => {
            const catItems = list.filter(item => item.category === cat);
            if (catItems.length > 0) {
                const group = document.createElement('optgroup');
                group.label = t.categories[cat] || cat;

                catItems.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    const name = item.name[currentLang] || item.name.de;
                    opt.innerText = `${name} (${item.menge} ${t.pcs} = ${item.dia} Dia)`;
                    group.appendChild(opt);
                });

                itemSelect.appendChild(group);
            }
        });

        calculate();
    }

    function filterItems() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = itemsData.filter(i => {
            const nameDe = i.name.de.toLowerCase();
            const nameEn = i.name.en.toLowerCase();
            const matchesQuery = nameDe.includes(query) || nameEn.includes(query) || i.category.toLowerCase().includes(query);
            const matchesCategory = activeCategory === 'ALL' || i.category === activeCategory;
            return matchesQuery && matchesCategory;
        });
        populateSelect(filtered);
    }

    function calculate() {
        const itemSelect = document.getElementById('itemSelect');
        const selectedId = itemSelect.value;
        const item = itemsData.find(i => i.id === selectedId);
        const t = translations[currentLang];

        if (!item) {
            document.getElementById('output').innerText = '0 Dia';
            document.getElementById('rateInfo').innerText = '-';
            return;
        }

        const unitType = document.getElementById('unitType').value;
        let amount = parseFloat(document.getElementById('amount').value) || 0;

        let totalItems = amount;
        if (unitType === 'stacks') {
            totalItems = amount * 64;
        }

        const pricePerItem = item.dia / item.menge;
        const totalDias = totalItems * pricePerItem;

        document.getElementById('output').innerText = `${totalDias.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US', { maximumFractionDigits: 2 })} Dia`;
        document.getElementById('rateInfo').innerText = `${t.rateLbl}: ${item.menge} ${t.pcs} = ${item.dia} Dia (${pricePerItem.toFixed(4)} ${t.perPiece})`;
    }

    function addToCart() {
        const itemSelect = document.getElementById('itemSelect');
        const selectedId = itemSelect.value;
        const item = itemsData.find(i => i.id === selectedId);
        if (!item) return;

        const unitType = document.getElementById('unitType').value;
        let amount = parseFloat(document.getElementById('amount').value) || 0;
        if (amount <= 0) return;

        let totalItems = unitType === 'stacks' ? amount * 64 : amount;
        const pricePerItem = item.dia / item.menge;
        const totalDias = totalItems * pricePerItem;

        cart.push({
            cartId: Date.now(),
            name: item.name,
            amount: amount,
            unitType: unitType === 'stacks' ? 'Stack(s)' : (currentLang === 'de' ? 'Stk.' : 'pcs.'),
            dias: totalDias
        });

        updateCartUI();
    }

    function removeFromCart(cartId) {
        cart = cart.filter(item => item.cartId !== cartId);
        updateCartUI();
    }

    function clearCart() {
        cart = [];
        updateCartUI();
    }

    function updateCartUI() {
        const cartList = document.getElementById('cartList');
        const t = translations[currentLang];

        if (cart.length === 0) {
            cartList.innerHTML = `<li style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 15px;">${t.cartEmpty}</li>`;
            return;
        }

        cartList.innerHTML = '';
        let sumDias = 0;

        cart.forEach(item => {
            sumDias += item.dias;
            const li = document.createElement('li');
            li.className = 'cart-item';
            const itemName = item.name[currentLang] || item.name.de;
            li.innerHTML = `
                <div>
                    <div class="cart-item-title">${itemName}</div>
                    <div class="cart-item-sub">${item.amount} ${item.unitType}</div>
                </div>
                <div class="cart-item-right">
                    <span class="cart-item-price">${item.dias.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US', { maximumFractionDigits: 2 })} Dia</span>
                    <button class="delete-btn" onclick="removeFromCart(${item.cartId})" title="Remove">✕</button>
                </div>
            `;
            cartList.appendChild(li);
        });

        const totalLi = document.createElement('li');
        totalLi.style.cssText = 'display: flex; justify-content: space-between; padding: 12px 16px; background: rgba(0, 180, 216, 0.15); border-radius: 10px; font-weight: 700; margin-top: 5px; border: 1px solid var(--accent);';
        totalLi.innerHTML = `
            <span>${t.cartTotal}</span>
            <span style="color: var(--accent-bright);">${sumDias.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US', { maximumFractionDigits: 2 })} Dia</span>
        `;
        cartList.appendChild(totalLi);
    }

    // Bei Browser-Vor/Zurück-Aktionen Sprache aus der URL laden
    window.addEventListener('popstate', () => {
        setLanguage(getLangFromUrl(), false);
    });

    // Beim ersten Aufrufen der Seite Sprache direkt aus der URL lesen
    setLanguage(getLangFromUrl(), false);
</script>

</body>
</html>
