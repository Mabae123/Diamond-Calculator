<div class="app-container">

        <h1>💎 <span id="titleText">Minecraft Diamanten Rechner</span></h1>

            <button class="lang-btn" id="btnEN" onclick="setLanguage('en')">EN 🇬🇧</button>
        </div>
    </div>

    <!-- Kategorie Filter -->
    <div class="category-bar" id="categoryBar"></div>

    <!-- Suche -->
    <div class="search-box grid-row">
        <div class="grid-col">
            <label for="search" id="lblSearch">Item Suchen:</label>
            <input type="text" id="search" placeholder="z. B. Erde, Quarz, Trank, Elytra..." oninput="filterItems()">
        </div>
    </div>

    <!-- Dropdown Item-Auswahl -->
    <div class="search-box">
        <label for="itemSelect" id="lblItem">Item auswählen:</label>
        <select id="itemSelect" onchange="calculate()"></select>
    </div>

    <!-- Einheiten und Menge -->
    <div class="grid-row" style="margin-top: 15px;">
        <div class="grid-col">
            <label for="unitType" id="lblUnit">Einheit:</label>
            <select id="unitType" onchange="calculate()">
                <option value="items" id="optItems">Einzeltitel / Stück</option>
                <option value="stacks" id="optStacks">Stacks (à 64 Stück)</option>
                <option value="hotbar" id="optHotbar">Hotbar (9 Stacks)</option>
                <option value="chest" id="optChest">Kiste (27 Stacks)</option>
                <option value="inv" id="optInv">Inventar / Inv (36 Stacks)</option>
                <option value="double_chest" id="optDoubleChest">Doppelkiste (54 Stacks / 2 Kisten)</option>
            </select>
        </div>
        <div class="grid-col">
            <label for="amount" id="lblAmount">Menge:</label>
            <input type="number" id="amount" value="1" min="0" step="any" oninput="calculate()">
        </div>
    </div>

    <button class="btn btn-secondary" onclick="addToCart()" id="btnAddToCart" style="margin-top: 5px; margin-bottom: 20px;">
        ➕ Zum Warenkorb hinzufügen
    </button>

    <!-- Ergebnis Anzeige -->
    <div class="result-card">
        <h2 id="lblTotal">Gesamtwert in Diamanten:</h2>
        <div class="result-value" id="output">0 Dia</div>
        <div class="rate-info" id="rateInfo">-</div>
    </div>

    <!-- Warenkorb Sektion -->
    <div class="cart-section">
        <div class="cart-header">
            <h3 id="lblCartTitle">🛒 Warenkorb (Mehrere Items)</h3>
            <button class="delete-btn" onclick="clearCart()" id="btnClearCart" title="Warenkorb leeren" style="font-size: 0.85rem; padding: 4px 8px; background: rgba(239, 68, 68, 0.1);">
                🗑️ Leeren
            </button>
        </div>

        <ul class="cart-list" id="cartList"></ul>

        <div id="toastMsg" class="toast-msg" style="margin-top: 15px;"></div>

        <!-- Kundenname & Tabelle-Kopieren Button (unter der Gesamtsumme) -->
        <div class="export-box" style="margin-top: 15px; margin-bottom: 0;">
            <input type="text" id="clientName" placeholder="Dein Name">
            <button class="btn" onclick="copyForSheet()" id="btnCopySheet">
                📋 Für Tabelle kopieren
            </button>
        </div>
    </div>
</div>

    function getLangFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const langParam = params.get('lang');
        if (langParam && (langParam.toLowerCase() === 'de' || langParam.toLowerCase() === 'en')) {
            return langParam.toLowerCase();
        }
        return 'de';
    }

    function setLanguage(lang, updateUrl = true) {
        currentLang = lang;

        if (updateUrl && window.history && window.history.replaceState) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url.toString());
        }

        document.getElementById('btnDE').classList.toggle('active', lang === 'de');
        document.getElementById('btnEN').classList.toggle('active', lang === 'en');

        const t = translations[lang];
        document.getElementById('titleText').innerText = t.title;
        document.getElementById('lblSearch').innerText = t.searchLbl;
        document.getElementById('search').placeholder = t.searchPh;
        document.getElementById('lblItem').innerText = t.itemLbl;
        document.getElementById('lblUnit').innerText = t.unitLbl;
        document.getElementById('optItems').innerText = t.unitItems;
        document.getElementById('optStacks').innerText = t.unitStacks;
        document.getElementById('optHotbar').innerText = t.unitHotbar;
        document.getElementById('optChest').innerText = t.unitChest;
        document.getElementById('optInv').innerText = t.unitInv;
        document.getElementById('optDoubleChest').innerText = t.unitDoubleChest;
        document.getElementById('lblAmount').innerText = t.amountLbl;
        document.getElementById('btnAddToCart').innerText = t.btnAddToCart;
        document.getElementById('lblTotal').innerText = t.totalLbl;
        document.getElementById('lblCartTitle').innerText = t.cartTitle;
        document.getElementById('btnClearCart').innerHTML = t.btnClearCart;
        document.getElementById('clientName').placeholder = t.clientPh;
        document.getElementById('btnCopySheet').innerText = t.btnCopySheet;

        renderCategories();
        filterItems();
        updateCartUI();
    }

    function renderCategories() {
        const t = translations[currentLang];
        const categoryBar = document.getElementById('categoryBar');
        const categories = ["ALL", "BAU-MATERIAL", "ERZE", "Book", "TRAENKE", "LOCATION", "SONSTIGES"];

        categoryBar.innerHTML = '';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `category-tab ${activeCategory === cat ? 'active' : ''}`;
            btn.dataset.cat = cat;
            btn.innerHTML = t.categories[cat] || cat;
            btn.onclick = () => {
                activeCategory = cat;
                renderCategories();
                filterItems();
            };
            categoryBar.appendChild(btn);
        });
    }

    function populateSelect(list) {
        const itemSelect = document.getElementById('itemSelect');
        const t = translations[currentLang];
        itemSelect.innerHTML = '';

        if (list.length === 0) {
            const opt = document.createElement('option');
            opt.innerText = currentLang === 'de' ? 'Keine Items gefunden' : 'No items found';
            itemSelect.appendChild(opt);
            calculate();
            return;
        }

        const categoryOrder = ["BAU-MATERIAL", "ERZE", "Book", "TRAENKE", "LOCATION", "SONSTIGES"];

        categoryOrder.forEach(cat => {
            const catItems = list.filter(item => item.category === cat);
            if (catItems.length > 0) {
                const group = document.createElement('optgroup');
                group.label = t.categories[cat] || cat;

                catItems.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    const name = item.name[currentLang] || item.name.de;
                    opt.innerText = `${name} (${item.menge} ${t.pcs} = ${item.dia} Dia)`;
                    group.appendChild(opt);
                });

                itemSelect.appendChild(group);
            }
        });

        calculate();
    }

    function filterItems() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = itemsData.filter(i => {
            const nameDe = i.name.de.toLowerCase();
            const nameEn = i.name.en.toLowerCase();
            const matchesQuery = nameDe.includes(query) || nameEn.includes(query) || i.category.toLowerCase().includes(query);
            const matchesCategory = activeCategory === 'ALL' || i.category === activeCategory;
            return matchesQuery && matchesCategory;
        });
        populateSelect(filtered);
    }

    function calculate() {
        const itemSelect = document.getElementById('itemSelect');
        const selectedId = itemSelect.value;
        const item = itemsData.find(i => i.id === selectedId);
        const t = translations[currentLang];

        if (!item) {
            document.getElementById('output').innerText = '0 Dia';
            document.getElementById('rateInfo').innerText = '-';
            return;
        }

        const unitType = document.getElementById('unitType').value;
        let amount = parseFloat(document.getElementById('amount').value) || 0;

        let totalItems = amount;
        if (unitType === 'stacks') {
            totalItems = amount * 64;
        } else if (unitType === 'hotbar') {
            totalItems = amount * 64 * 9;
        } else if (unitType === 'chest') {
            totalItems = amount * 64 * 27;
        } else if (unitType === 'inv') {
            totalItems = amount * 64 * 36;
        } else if (unitType === 'double_chest') {
            totalItems = amount * 64 * 54;
        }

        const pricePerItem = item.dia / item.menge;
        const totalDias = totalItems * pricePerItem;

        document.getElementById('output').innerText = `${totalDias.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US', { maximumFractionDigits: 2 })} Dia`;
        document.getElementById('rateInfo').innerText = `${t.rateLbl}: ${item.menge} ${t.pcs} = ${item.dia} Dia (${pricePerItem.toFixed(4)} ${t.perPiece})`;
    }

    function addToCart() {
        const itemSelect = document.getElementById('itemSelect');
        const selectedId = itemSelect.value;
        const item = itemsData.find(i => i.id === selectedId);
        if (!item) return;

        const unitType = document.getElementById('unitType').value;
        let amount = parseFloat(document.getElementById('amount').value) || 0;
        if (amount <= 0) return;

        let totalItems = amount;
        let unitLabel = currentLang === 'de' ? 'Stk.' : 'pcs.';

        if (unitType === 'stacks') {
            totalItems = amount * 64;
            unitLabel = 'Stack(s)';
        } else if (unitType === 'hotbar') {
            totalItems = amount * 64 * 9;
            unitLabel = 'Hotbar(s)';
        } else if (unitType === 'chest') {
            totalItems = amount * 64 * 27;
            unitLabel = currentLang === 'de' ? 'Kiste(n)' : 'Chest(s)';
        } else if (unitType === 'inv') {
            totalItems = amount * 64 * 36;
            unitLabel = 'Inv';
        } else if (unitType === 'double_chest') {
            totalItems = amount * 64 * 54;
            unitLabel = currentLang === 'de' ? 'Doppelkiste(n)' : 'Double Chest(s)';
        }

        const pricePerItem = item.dia / item.menge;
        const totalDias = totalItems * pricePerItem;

        cart.push({
            cartId: Date.now(),
            name: item.name,
            amount: amount,
            unitType: unitLabel,
            totalItems: totalItems,
            dias: totalDias
        });

        updateCartUI();
    }

    function removeFromCart(cartId) {
        cart = cart.filter(item => item.cartId !== cartId);
        updateCartUI();
    }

    function clearCart() {
        cart = [];
        updateCartUI();
    }

    function copyForSheet() {
        const t = translations[currentLang];
        if (cart.length === 0) {
            showToast(t.emptyCartMsg, true);
            return;
        }

        const clientInput = document.getElementById('clientName').value.trim();
        const clientName = clientInput || (currentLang === 'de' ? 'Unbekannt' : 'Unknown');
        const today = new Date().toLocaleDateString(currentLang === 'de' ? 'de-DE' : 'en-US');

        // Erstelle Tab-getrennte Zeilen gemäß Sheet-Struktur:
        // CLIENT | DATUM | MATERIAL | MENGE | DIA
        const rows = cart.map(item => {
            const itemName = item.name[currentLang] || item.name.de;
            const mengeVal = item.totalItems; // Einfache Zahl für Tabellen-Formeln
            const diaFormatted = item.dias.toFixed(2).replace('.', ',');
            return `${clientName}\t${today}\t${itemName}\t${mengeVal}\t${diaFormatted}`;
        });

        const copyText = rows.join('\n');

        // Clipboard via verdeckter Textarea (Sicher in iFrames)
        const textarea = document.createElement('textarea');
        textarea.value = copyText;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        
        try {
            document.execCommand('copy');
            showToast(t.copiedMsg, false);
        } catch (err) {
            showToast("Fehler beim Kopieren", true);
        } finally {
            document.body.removeChild(textarea);
        }
    }

    function showToast(msg, isError) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.backgroundColor = isError ? 'var(--danger)' : 'var(--success)';
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3500);
    }

    function updateCartUI() {
        const cartList = document.getElementById('cartList');
        const t = translations[currentLang];

        if (cart.length === 0) {
            cartList.innerHTML = `<li style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 15px;">${t.cartEmpty}</li>`;
            return;
        }

        cartList.innerHTML = '';
        let sumDias = 0;

        cart.forEach(item => {
            sumDias += item.dias;
            const li = document.createElement('li');
            li.className = 'cart-item';
            const itemName = item.name[currentLang] || item.name.de;
            li.innerHTML = `
                <div>
                    <div class="cart-item-title">${itemName}</div>
                    <div class="cart-item-sub">${item.amount} ${item.unitType}</div>
                </div>
                <div class="cart-item-right">
                    <span class="cart-item-price">${item.dias.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US', { maximumFractionDigits: 2 })} Dia</span>
                    <button class="delete-btn" onclick="removeFromCart(${item.cartId})" title="Remove">✕</button>
                </div>
            `;
            cartList.appendChild(li);
        });

        const totalLi = document.createElement('li');
        totalLi.style.cssText = 'display: flex; justify-content: space-between; padding: 12px 16px; background: rgba(0, 180, 216, 0.15); border-radius: 10px; font-weight: 700; margin-top: 5px; border: 1px solid var(--accent);';
        totalLi.innerHTML = `
            <span>${t.cartTotal}</span>
            <span style="color: var(--accent-bright);">${sumDias.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US', { maximumFractionDigits: 2 })} Dia</span>
        `;
        cartList.appendChild(totalLi);
    }

    window.addEventListener('popstate', () => {
        setLanguage(getLangFromUrl(), false);
    });

    // Start-Initialisierung
    setLanguage(getLangFromUrl(), false);
</script>
